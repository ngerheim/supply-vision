name: Dependencias

# Num PR que adiciona ou atualiza pacote, aponta versao com vulnerabilidade
# conhecida antes do merge. Complementa o Dependabot e o npm/pip audit do CI.
on:
  pull_request:

permissions:
  contents: read

jobs:
  revisao:
    name: Revisao de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
