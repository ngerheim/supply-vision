name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portal:
    name: Portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  alertas:
    name: Alertas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            alertas/config/requirements.txt
            alertas/config/requirements-dev.txt
      - run: pip install -r alertas/config/requirements.txt -r alertas/config/requirements-dev.txt
      - name: Preparar configuração fictícia
        run: |
          mkdir -p privado/comum privado/alertas/config
          mkdir -p privado/alertas/parametros/de_para privado/alertas/parametros/filtros
          cp compartilhado/smtp.env.example privado/comum/smtp.env
          cp alertas/config/cfg_ambiente.exemplo.txt privado/alertas/config/cfg_ambiente.txt
          cp alertas/config/cfg_qlik.exemplo.txt privado/alertas/config/cfg_qlik.txt
          cp alertas/config/destinatarios.exemplo.txt privado/alertas/config/destinatarios.txt
          for arquivo in alertas/parametros/de_para/*.exemplo.csv; do
            cp "$arquivo" "privado/alertas/parametros/de_para/$(basename "$arquivo" .exemplo.csv).csv"
          done
          for arquivo in alertas/parametros/filtros/*.exemplo.txt; do
            cp "$arquivo" "privado/alertas/parametros/filtros/$(basename "$arquivo" .exemplo.txt).txt"
          done
      - run: python -m pytest alertas/tests -q
