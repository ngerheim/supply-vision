name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r config/requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q processo panorama parametros
