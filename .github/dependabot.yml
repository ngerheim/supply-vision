# Atualizacao de dependencias por PR, para o CI provar cada uma antes de
# qualquer coisa chegar ao servidor.
#
# Os grupos existem para juntar o que sobe junto -- React com as tipagens do
# React, Tailwind com o plugin do Tailwind -- e nada alem disso. A primeira
# versao tinha um grupo "producao" com patterns ['*'], que virou um PR de 17
# pacotes: quando o CI reprovou, nao havia como saber qual deles foi, e o PR
# so servia para ser fechado. O que nao entra em grupo vem individual, que e
# facil de aprovar e facil de reverter.
#
# Majors ficam fora dos grupos de proposito: cada uma merece ser lida sozinha.
version: 2
updates:
  - package-ecosystem: npm
    directory: /portal
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - react
          - react-dom
          - react-server-dom-webpack
          - '@types/react'
          - '@types/react-dom'
        update-types: [minor, patch]
      tailwind:
        patterns:
          - tailwindcss
          - '@tailwindcss/*'
          - tailwind-merge
          - tw-animate-css
        update-types: [minor, patch]
      ferramental:
        patterns:
          - oxlint
          - oxlint-*
          - oxfmt
          - typescript
          - vite
          - '@vitejs/*'
        update-types: [minor, patch]
      # Runtime do Portal: wrangler, vinext e os pacotes da Cloudflare sobem
      # juntos porque compartilham contrato.
      plataforma:
        patterns:
          - vinext
          - wrangler
          - '@cloudflare/*'
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /alertas/config
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      alertas:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
